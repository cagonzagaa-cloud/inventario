<div class="modal fade"
    id="detalleModal"
    tabindex="-1"
    data-bs-backdrop="static"
    data-bs-keyboard="false">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content border-0 shadow-lg rounded-4">
            
            <!-- CABECERA -->

            <div class="modal-header bg-primary text-white">

                <h4
                    class="modal-title"
                    id="tituloDetalle">

                    Agregar Producto

                </h4>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <!-- FORMULARIO -->

            <form
                id="formDetalle"
                method="POST"
                action="{% url 'agregar_detalle_entrada' entrada.id %}">

                {% csrf_token %}
                <input
                    type="hidden"
                    id="detalle_id"
                    name="detalle_id"
                    value="">

                <div class="modal-body">

                    <!-- PRODUCTO -->

                    <div class="card border-0 shadow-sm mb-4">

                        <div class="card-header bg-light">

                            <strong>

                                <i class="bi bi-box-seam"></i>

                                Información del Producto

                            </strong>

                        </div>

                        <div class="card-body">

                            <div class="mb-3">

                                <label class="form-label">

                                    Producto

                                </label>

                                <select
                                    name="producto"
                                    id="id_producto"
                                    class="form-select"
                                    required>

                                    <option value="">

                                        Seleccione un producto...

                                    </option>

                                    {% for producto in productos %}

                                        <option value="{{ producto.id }}">

                                            {{ producto.codigo }} - {{ producto.nombre }}

                                        </option>

                                    {% endfor %}

                                </select>

                            </div>

                            <div class="row">

                                <div class="col-md-4">

                                    <label class="form-label">

                                        Cantidad

                                    </label>

                                    <input
                                        type="number"
                                        id="id_cantidad"
                                        name="cantidad"
                                        class="form-control"
                                        min="1"
                                        value="1"
                                        required>

                                </div>

                                <div class="col-md-4">

                                    <label class="form-label">

                                        Costo Unitario

                                    </label>

                                    <input
                                        type="number"
                                        id="id_costo"
                                        name="costo"
                                        class="form-control"
                                        min="0"
                                        step="0.01"
                                        required>

                                </div>

                                <div class="col-md-4">

                                    <label class="form-label">

                                        Subtotal

                                    </label>

                                    <input
                                        type="text"
                                        id="id_subtotal"
                                        class="form-control"
                                        value="$ 0.00"
                                        readonly>

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- MENSAJE -->

                    <div class="alert alert-info">

                        <i class="bi bi-info-circle"></i>

                        El subtotal se calcula automáticamente según la cantidad y el costo unitario.

                    </div>

                </div>

                <!-- BOTONES -->

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                        type="submit"
                        id="btnGuardarDetalle"
                        class="btn btn-primary">

                        <i class="bi bi-save"></i>

                        Guardar Producto

                    </button>
                </div>

            </form>

        </div>

    </div>

</div>
