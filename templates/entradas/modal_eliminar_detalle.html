<div class="modal fade"
    id="modalEliminarDetalle"
    tabindex="-1"
    aria-labelledby="modalEliminarDetalleLabel"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <form method="POST"
                  id="formEliminarDetalleEntrada">

                {% csrf_token %}

                <div class="modal-header bg-danger text-white">

                    <h5 class="modal-title"
                        id="modalEliminarDetalleLabel">
                        <i class="bi bi-trash"></i>
                        Eliminar Producto
                    </h5>

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body text-center">

                    <i class="bi bi-exclamation-triangle-fill text-danger"
                       style="font-size: 60px;"></i>

                    <h5 class="mt-3">¿Está seguro de eliminar este producto?</h5>

                    <p class="text-muted mb-0">
                        Esta acción no se puede deshacer.
                    </p>

                    <p class="fw-bold mt-3 mb-0"
                       id="productoEliminarDetalle">
                    </p>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="submit"
                            class="btn btn-danger">
                        <i class="bi bi-trash"></i>
                        Eliminar
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
