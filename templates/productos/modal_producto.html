<div class="modal fade"
    id="productoModal"
    tabindex="-1"
    data-bs-backdrop="static"
    data-bs-keyboard="false">

    <div class="modal-dialog modal-xl modal-dialog-centered">

        <div class="modal-content producto-modal border-0 shadow-lg rounded-4">

            <div class="modal-header bg-primary text-white">

                <h4 class="modal-title" id="tituloProducto">

                    Nuevo Producto

                </h4>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <form
                id="formProducto"
                method="POST"
                action="{% url 'crear_producto' %}">

                {% csrf_token %}

                <div class="modal-body">

                    <!-- =============================== -->
                    <!-- INFORMACIÓN GENERAL -->
                    <!-- =============================== -->

                    <div class="card border-0 shadow-sm mb-4">

                        <div class="card-header bg-light">

                            <strong>

                                <i class="bi bi-box"></i>

                                Información General

                            </strong>

                        </div>

                        <div class="card-body">

                            <div class="row">

                                <div class="col-md-4 mb-3">

                                    <label>

                                        Código *

                                    </label>

                                    {{ form.codigo }}

                                </div>

                                <div class="col-md-8 mb-3">

                                    <label>

                                        Nombre *

                                    </label>

                                    {{ form.nombre }}

                                </div>

                            </div>

                            <div class="mb-3">

                                <label>

                                    Descripción

                                </label>

                                {{ form.descripcion }}

                            </div>

                            <div class="mb-3">

                                <label>

                                    Categoría

                                </label>

                                {{ form.categoria }}

                            </div>

                        </div>

                    </div>

                    <!-- =============================== -->
                    <!-- INFORMACIÓN COMERCIAL -->
                    <!-- =============================== -->

                    <div class="card border-0 shadow-sm mb-4">

                        <div class="card-header bg-light">

                            <strong>

                                <i class="bi bi-currency-dollar"></i>

                                Información Comercial

                            </strong>

                        </div>

                        <div class="card-body">

                            <div class="row">

                                <div class="col-md-6">

                                    <label>

                                        Costo

                                    </label>

                                    {{ form.costo }}

                                </div>

                                <div class="col-md-6">

                                    <label>

                                        Precio Venta

                                    </label>

                                    {{ form.precio }}

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- =============================== -->
                    <!-- INVENTARIO -->
                    <!-- =============================== -->

                    <div class="card border-0 shadow-sm">

                        <div class="card-header bg-light">

                            <strong>

                                <i class="bi bi-boxes"></i>

                                Inventario

                            </strong>

                        </div>

                        <div class="card-body">

                            <div class="row">

                                <div class="col-md-4">

                                    <label>

                                        Stock

                                    </label>

                                    <input
                                    type="number"
                                    name="stock"
                                    id="id_stock"
                                    class="form-control"
                                    min="0">

                                </div>

                                <div class="col-md-4">

                                    <label>

                                        Stock Mínimo

                                    </label>

                                    <input
                                        type="number"
                                        name="stock_minimo"
                                        id="id_stock_minimo"
                                        class="form-control"
                                        min="0">

                                </div>

                                <div class="col-md-4 d-flex align-items-center">

                                    <div class="form-check mt-4">

                                        {{ form.estado }}

                                        <label class="form-check-label">

                                            Producto Activo

                                        </label>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                        type="button">

                        Cancelar

                    </button>

                    <button
                        class="btn btn-primary">

                        <i class="bi bi-save"></i>

                        Guardar Producto

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
