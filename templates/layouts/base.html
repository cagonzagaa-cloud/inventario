{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>{% block title %}Sistema de Inventario{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.datatables.net/2.3.2/css/dataTables.bootstrap5.css">

    <link rel="stylesheet"
        href="https://cdn.datatables.net/responsive/3.0.3/css/responsive.bootstrap5.css">
    
    
    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/cards.css' %}">
    <link rel="stylesheet" href="{% static 'css/tables.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/productos.css' %}">
    <link rel="stylesheet" href="{% static 'css/modal.css' %}">

</head>

<body>

<div class="layout">

    {% include 'includes/sidebar.html' %}

    <div class="main-content">

        {% include 'includes/navbar.html' %}

        <main class="content">

            {% block content %}

            {% endblock %}

        </main>

        {% include 'includes/footer.html' %}

    </div>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- DataTables -->
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Tus JS -->
<script src="{% static 'js/app.js' %}"></script>
<script src="{% static 'js/sidebar.js' %}"></script>
<script src="{% static 'js/dashboard.js' %}"></script>
<script src="{% static 'js/productos.js' %}"></script>
<script src="{% static 'js/proveedores.js' %}"></script>
<script src="{% static 'js/categorias.js' %}"></script>
<script src="{% static 'js/entradas.js' %}"></script>
<script src="{% static 'js/detalle_entrada.js' %}"></script>
<script src="{% static 'js/clientes.js' %}"></script>
<script src="{% static 'js/salidas.js' %}"></script>
<script src="{% static 'js/detalle_salida.js' %}"></script>
<script src="{% static 'js/reportes.js' %}"></script>
{% if messages %}

    {% for message in messages %}

    <script>

        Swal.fire({

            icon: '{% if message.tags == "error" %}error{% elif message.tags == "warning" %}warning{% else %}success{% endif %}',

            title: '{% if message.tags == "error" %}No se pudo completar{% elif message.tags == "warning" %}Atención{% else %}Operación realizada{% endif %}',

            text: '{{ message }}',

            timer: 2000,

            showConfirmButton: false

        });

    </script>

    {% endfor %}

{% endif %}

</body>
</html>
