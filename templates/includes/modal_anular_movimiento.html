<div class="modal fade" id="modalAnularMovimiento" tabindex="-1" aria-labelledby="modalAnularMovimientoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <form method="post" id="formAnularMovimiento">
                {% csrf_token %}
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalAnularMovimientoLabel"><i class="bi bi-x-circle-fill me-2"></i> Anular movimiento</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3.5rem;"></i>
                    <h5 class="mt-3">¿Está seguro de anular este movimiento?</h5>
                    <p class="text-muted mb-2">El stock asociado será revertido automáticamente.</p>
                    <p class="fw-bold mb-0" id="codigoMovimientoAnular"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-danger"><i class="bi bi-x-circle"></i> Sí, anular</button>
                </div>
            </form>
        </div>
    </div>
</div>
