<div class="modal fade"
    id="modalEliminarCliente"
    tabindex="-1"
    aria-labelledby="modalEliminarClienteLabel"
    aria-hidden="true">

<div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">

        <form method="POST" id="formEliminarCliente">

            {% csrf_token %}

            <div class="modal-header bg-danger text-white">

                <h5 class="modal-title" id="modalEliminarClienteLabel">
                    <i class="bi bi-trash-fill me-2"></i>
                    Eliminar Cliente
                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body text-center">

                <i class="bi bi-exclamation-triangle-fill text-danger"
                    style="font-size: 60px;"></i>

                <h5 class="mt-3">
                    ¿Está seguro de eliminar este cliente?
                </h5>

                <p class="text-muted mb-0">
                    Esta acción no se puede deshacer.
                </p>

                <p class="fw-bold mt-3 mb-0"
                    id="nombreClienteEliminar">
                </p>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button type="submit"
                        class="btn btn-danger">

                    <i class="bi bi-trash"></i>
                    Eliminar

                </button>

            </div>

        </form>

    </div>

</div>

</div>
