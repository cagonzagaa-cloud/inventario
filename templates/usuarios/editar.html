{% extends 'layouts/base.html' %}

{% block title %}Editar usuario{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3 class="fw-bold mb-4">
            <i class="bi bi-pencil-square"></i>
            Editar usuario
        </h3>

        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="id_username">Usuario</label>
                    {{ form.username }}
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="id_first_name">Nombres</label>
                    {{ form.first_name }}
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="id_last_name">Apellidos</label>
                    {{ form.last_name }}
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="id_email">Correo</label>
                    {{ form.email }}
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="id_password1">Nueva contraseña</label>
                    {{ form.password1 }}
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="id_password2">Confirmar contraseña</label>
                    {{ form.password2 }}
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="id_rol">Rol</label>
                    {{ form.rol }}
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{% url 'lista_usuarios' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
